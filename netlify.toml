[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and the TypeScript build need a modern Node; Netlify's default is older.
  NODE_VERSION = "22"

# Single-page app: every path must serve index.html rather than 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Camera and mic are needed for calls; nothing else is.
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"

# Hashed assets never change contents, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
